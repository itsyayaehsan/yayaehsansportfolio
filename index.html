    {
      id: 'p5', name: 'Project 02 (Making the Invisible Visible)', x: 89, y: 29, layout: 'story',
      title: 'Making the Invisible Visible', type: 'BA User Experience Design · London College of Communication, UAL',
      intro: 'Making the Invisible Visible explores the often-unspoken judgements faced by young Muslim women surrounding the choice to wear, or not wear, the hijab. Through visual research and mapping, I investigated how cultural expectations, personal beliefs, and external perceptions influence identity and belonging. The project aims to make these invisible social pressures visible, encouraging greater understanding of the diverse experiences of Muslim women.',
      hero: [
        { src: 'images/invisible/hero-photo.jpg',  caption: 'Photographed by me' },
        { src: 'images/invisible/final-piece.jpg', caption: 'Final piece: “It’s always a choice”' },
      ],
      quote: '“How do Muslim girls in their teens and early adulthood make personal choices about wearing—or not wearing—the hijab, and how do these choices show the diversity in their identities and the judgement they may face?”',
      sections: [
        { heading: 'Mapping', text: [
          'I mapped the forces shaping young Muslim women’s choices about the hijab. Inner layers are direct, personal pressures: family, peers, community “aunties” and religious figures. Middle layers are indirect but influential environments: mosque culture, community norms, school and university, and social media audiences. Outer layers are systemic forces: government narratives, Western media, historical Islamophobia, and AI platforms and algorithms.',
        ], images: [
          { src: 'images/invisible/mapping.jpg', caption: 'Project mapping: forces shaping women’s choices about the hijab', wide: true },
        ] },
        { heading: 'Ideas', text: [
          'I sketched infographic ideas around three themes. Negotiation paths: branching lines, some blocked, some fading out, with no “correct” route. The gaze: women are constantly observed, and judgement comes from both inside and outside the community. Layers of pressure: judgement is made when we don’t know the layers of an individual.',
        ], images: [
          { src: 'images/invisible/sketches.jpg',         caption: 'Rough prototype sketches' },
          { src: 'images/invisible/infographic-plan.jpg', caption: 'How I will interpret this in my infographic' },
        ] },
        { heading: 'Typography', text: [
          'I wanted to use Arabic text, but my audience wouldn’t be able to read it, so I created a hand-drawn, Arabic-inspired “faux Arabic” font. Making the type handwritten adds personal expression and authenticity, supporting my message that Muslim girls should be allowed autonomy and choice.',
        ], images: [
          { src: 'images/invisible/typography-1.jpg', caption: 'Typography practice' },
          { src: 'images/invisible/typography-2.jpg', caption: 'Ascender, x-height and baseline' },
        ] },
        { heading: 'Photoshoot', text: [
          'I photographed outside a mosque, using dark-toned colours to communicate emotional burden, internal conflict and psychological pressure. A sideways view, half facing the mosque and half facing away, shows being conflicted between choices.',
        ], images: [
          { src: 'images/invisible/photoshoot.jpg', caption: 'Photoshoot for the infographic', wide: true },
        ] },
        { heading: 'Photoshop', text: [
          'Black and white strips away colour, so the viewer focuses on facial expression, form and symbolism. The absence of colour symbolises erasure of choice, voice or cultural expression. Handwritten text brings back a human voice within a digitally altered space.',
          'The quotes replacing the hair are words hijabi and non-hijabi women have had said to them online and in real life, gathered from personal experience, WIRED articles, and comments on Instagram and TikTok.',
        ], images: [
          { src: 'images/invisible/photoshop.jpg', caption: 'Three Photoshop versions', wide: true },
        ] },
        { heading: 'Final piece', text: [
          'Made from pearl grey card, fibre mesh and acrylic, A4.',

      sections: [

        ] },
        { heading: 'Research', text: [
          'I collected images of war and protest, then mapped how war changes time, family relationships and childhood, organised around three words: observe, seek, challenge.',
        ], images: [
          { src: 'images/war/ledoux.jpg',   caption: 'Artist research: Stephanie Ledoux, and my collage study' },
          { src: 'images/war/al-omari.jpg', caption: 'Artist research: Abdul Al Omari, and my portrait study' },
        ] },
        { heading: 'Development', text: [

        ], images: [
          { src: 'images/war/mark-powell.jpg',   caption: 'Mark Powell research and portrait studies of my great-grandmother' },
          { src: 'images/war/fence-studies.jpg', caption: 'Planning the younger self: rusting fences, grasping hands, the eyes' },
        ] },
        { heading: 'Reflection', text: [

  /* ---------- Window contents ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* An image with a caption; shows a labelled placeholder until the file exists */
  function fig(im) {
    return `<figure class="${im.wide ? 'wide' : ''}">
      <img src="${esc(im.src)}" alt="${esc(im.caption)}" loading="lazy" ${im.fallback ? `data-fallback="${esc(im.fallback)}"` : ''} onerror="imgMissing(this)">
      <figcaption>${esc(im.caption)}</figcaption>
    </figure>`;
  }
  function imgMissing(img) {
    const fb = img.dataset.fallback;
    if (fb && img.src !== fb) { img.src = fb; return; }
    const ph = document.createElement('div');
    ph.className = 'ph';
    ph.textContent = img.alt;
    img.replaceWith(ph);
  }

  function storyBody(p) {
    return `
      <article class="story">
        <header class="story-head">
          <p class="eyebrow">${esc(p.type)}</p>
          <h2>${esc(p.title)}</h2>
          <p class="intro">${esc(p.intro)}</p>
        </header>
        <div class="story-hero">
          <div class="pair n${p.hero.length}">${p.hero.map(fig).join('')}</div>
          ${p.quote ? `<blockquote>${esc(p.quote)}</blockquote>` : ''}
        </div>
        ${p.sections.map(s => `
          <section class="story-section">
            <div class="row">
              <h3>${esc(s.heading)}</h3>
              <div>${s.text.map(t => `<p>${esc(t)}</p>`).join('')}</div>
            </div>
            ${s.images ? `<div class="figs n${s.images.length}">${s.images.map(fig).join('')}</div>` : ''}
          </section>`).join('')}
      </article>`;
  }

  function galleryBody(p) {
    return `
      <article class="photo-page">
        <header class="story-head">
          <p class="eyebrow">${esc(p.type)}</p>
          <h2>${esc(p.title)}</h2>
          <p class="intro">${esc(p.intro)}</p>
        </header>
        <div class="masonry">
          ${p.photos.map((src, i) => `
            <button class="shot" data-photos="${p.id}" data-i="${i}" aria-label="View photo ${i + 1} large">
              <img src="${esc(src)}" alt="${esc(p.title)}, photo ${i + 1}">
            </button>`).join('')}
        </div>
        ${p.quote ? `<figure class="photo-quote"><blockquote>${esc(p.quote)}</blockquote><figcaption>— ${esc(p.quoteBy)}</figcaption></figure>` : ''}
      </article>`;
  }

  /* Lightbox: click a photo to see it large, arrows / keys to move */
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<button class="lb-close" aria-label="Close">×</button>
    <button class="lb-prev" aria-label="Previous photo">‹</button>
    <img alt=""><button class="lb-next" aria-label="Next photo">›</button>`;
  document.body.appendChild(lb);
  let lbList = [], lbI = 0;
  const lbShow = () => { lb.querySelector('img').src = lbList[lbI]; lb.querySelector('img').alt = `Photo ${lbI + 1} of ${lbList.length}`; };
  const lbStep = d => { lbI = (lbI + d + lbList.length) % lbList.length; lbShow(); };
  lb.querySelector('.lb-close').onclick = () => lb.classList.remove('on');
  lb.querySelector('.lb-prev').onclick = () => lbStep(-1);
  lb.querySelector('.lb-next').onclick = () => lbStep(1);
  lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('on'); });
  document.addEventListener('click', e => {
    // Story pages: click any image to see it large
    const fi = e.target.closest('.story figure img');
    if (fi) {
      const all = [...fi.closest('.story').querySelectorAll('figure img')];
      lbList = all.map(i => i.src); lbI = all.indexOf(fi); lbShow(); lb.classList.add('on');
      return;
    }
    const s = e.target.closest('.shot');
    if (!s) return;
    lbList = PROJECTS.find(p => p.id === s.dataset.photos).photos;
    lbI = +s.dataset.i; lbShow(); lb.classList.add('on');
  });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('on')) return;
    if (e.key === 'ArrowLeft') lbStep(-1);
    if (e.key === 'ArrowRight') lbStep(1);
    if (e.key === 'Escape') { lb.classList.remove('on'); e.stopImmediatePropagation(); }
  }, true);

  function videosBody(p) {
    return `
      <article class="video-page">
        <header>
          <p class="eyebrow">${esc(p.type)}</p>
          <h2>${esc(p.title)}</h2>
          ${p.note ? `<p class="video-note">${esc(p.note)}</p>` : ''}
        </header>
        <div class="polaroids">
          ${p.videos.map(v => `
            <figure class="polaroid">
              <video src="${esc(v.src)}#t=0.1" controls playsinline preload="metadata"></video>
              <figcaption>${esc(v.caption)}</figcaption>
            </figure>`).join('')}
        </div>
      </article>`;
  }
  // Only one video plays at a time
  document.addEventListener('play', e => {
    if (e.target.tagName !== 'VIDEO') return;
    document.querySelectorAll('video').forEach(v => { if (v !== e.target) v.pause(); });
  }, true);

  function projectBody(p) {
    if (p.layout === 'story') return storyBody(p);
    if (p.layout === 'videos') return videosBody(p);
    if (p.layout === 'gallery') return galleryBody(p);
    const cover = p.cover
      ? `<img class="cover" src="${esc(p.cover)}" alt="${esc(p.title)} cover">`
      : `<div class="cover ph">cover image</div>`;
    const imgs = p.images.length
      ? p.images.map(src => `<img src="${esc(src)}" alt="${esc(p.title)}" loading="lazy">`).join('')
      : '<div class="ph">✦</div><div class="ph">✦</div><div class="ph">✦</div><div class="ph">✦</div>';
    const section = (label, text) => text ? `<h3>${label}</h3><p>${esc(text)}</p>` : '';
    const fact = (label, text) => text ? `<div><dt>${label}</dt><dd>${esc(text)}</dd></div>` : '';
    return `
      <article class="project">
        ${cover}
        <div class="case">
          <div class="case-main">
            <p class="eyebrow">${esc(p.type)} · ${esc(p.year)}</p>
            <h2>${esc(p.title)}</h2>
            ${section('Overview', p.summary)}
            ${section('Process', p.process)}
            ${section('Outcome', p.outcome)}
          </div>
          <dl class="facts">
            ${fact('Type', p.type)}
            ${fact('Year', p.year)}
            ${fact('My role', p.role)}
            ${fact('Tools', p.tools)}
          </dl>
        </div>
        <h3 class="gallery-title">Gallery</h3>
        <div class="gallery">${imgs}</div>
      </article>`;
  }

        <a class="btn" href="mailto:itsyayaehsan@gmail.com">Email me</a>
      </div>` },
    resume: { title: 'Resume.pdf', w: 780, big: true, body: `
      <div class="resume">
        <object data="resume.pdf" type="application/pdf">
          <p class="muted">Your browser can’t show the PDF here. Use the buttons below to open or download it.</p>
        </object>
        <div class="resume-actions">
          <a class="btn" href="resume.pdf" target="_blank" rel="noopener">Open in new tab</a>
          <a class="btn ghost" href="resume.pdf" download="Yaya Ehsan CV.pdf">Download</a>
        </div>
      </div>` },
    secret: { title: 'Don’t Look', w: 380, body: `
      <div class="secret">
        <p class="big">👀</p>
        <p>You looked. Here are my rejected ideas, bad first drafts and 400 blurry photos.</p>
        <p class="muted">Every good project starts here ✦</p>
      </div>` },
  };
  PROJECTS.forEach(p => WINDOWS[p.id] = { title: p.name, w: 940, big: true, body: () => projectBody(p) });
  WINDOWS.photos.w = 940; WINDOWS.photos.big = true;

  /* ---------- Icons ---------- */
  function folderSVG() {
    return `<svg viewBox="0 0 64 52" class="ico"><path d="M2 8a4 4 0 0 1 4-4h18l5 5h29a4 4 0 0 1 4 4v33a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="#e48aab"/><path d="M2 16a4 4 0 0 1 4-4h52a4 4 0 0 1 4 4v30a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="#f4b3c9"/></svg>`;
  }
  const ART = {
    folder: folderSVG,
    doc: () => `<svg viewBox="0 0 48 60" class="ico doc"><path d="M4 2h28l12 12v42a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#fff" stroke="#ccc"/><path d="M32 2v12h12" fill="#eee" stroke="#ccc"/><text x="23" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#d65a5a" font-family="Inter">PDF</text></svg>`,
    txt: () => `<svg viewBox="0 0 48 60" class="ico doc"><path d="M4 2h28l12 12v42a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#fff" stroke="#ccc"/><path d="M32 2v12h12" fill="#eee" stroke="#ccc"/><g stroke="#bbb" stroke-width="2"><line x1="10" y1="26" x2="38" y2="26"/><line x1="10" y1="33" x2="38" y2="33"/><line x1="10" y1="40" x2="30" y2="40"/></g></svg>`,
    trash: () => `<svg viewBox="0 0 48 60" class="ico doc"><rect x="6" y="10" width="36" height="6" rx="2" fill="#d9d9de"/><path d="M9 18h30l-3 38H12z" fill="#ececf0" stroke="#c5c5cc"/><g stroke="#c5c5cc" stroke-width="1.5"><line x1="18" y1="24" x2="19" y2="50"/><line x1="24" y1="24" x2="24" y2="50"/><line x1="30" y1="24" x2="29" y2="50"/></g></svg>`,
  };

  const desktop = document.getElementById('desktop');
  const iconLayer = document.getElementById('icons');
  const winLayer = document.getElementById('windows');
  const isMobile = () => matchMedia('(max-width: 700px)').matches;

  ICONS.forEach(ic => {
    const el = document.createElement('button');
    el.className = 'icon';
    el.dataset.id = ic.id;
    el.style.left = ic.x + '%';
    el.style.top = ic.y + '%';
    el.innerHTML = ART[ic.kind]() + `<span class="label">${esc(ic.name)}</span>`;
    iconLayer.appendChild(el);
    makeDraggable(el, el, { onClick: () => openWin(ic.id), keepInside: true });
  });

  /* ---------- Windows ---------- */
  let z = 10, offset = 0;
  const open = {};

  function openWin(id) {
    const def = WINDOWS[id];
    if (!def) return;
    if (open[id]) { focus(open[id]); return; }
    const w = document.createElement('section');
    w.className = 'window';
    w.setAttribute('role', 'dialog');
    w.setAttribute('aria-label', def.title);
    const width = Math.min(def.w, desktop.clientWidth - 24);
    w.style.width = width + 'px';
    w.style.left = Math.max(12, (desktop.clientWidth - width) / 2 + offset) + 'px';
    w.style.top = Math.max(12, (def.big ? 16 : 60) + offset) + 'px';
    if (def.big) w.classList.add('big');
    offset = (offset + 28) % 140;
    w.innerHTML = `
      <div class="titlebar">
        <span class="lights"><button class="close" aria-label="Close"></button><i></i><button class="zoom" aria-label="Full screen"></button></span>
        <span class="wtitle">${esc(def.title)}</span>
      </div>
      <div class="wbody">${typeof def.body === 'function' ? def.body() : def.body}</div>`;
    winLayer.appendChild(w);
    open[id] = w;
    focus(w);
    w.addEventListener('pointerdown', () => focus(w));
    w.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); w.remove(); delete open[id]; });
    w.querySelector('.zoom').addEventListener('click', e => { e.stopPropagation(); w.classList.toggle('max'); });
    w.querySelector('.titlebar').addEventListener('dblclick', () => w.classList.toggle('max'));
    if (!isMobile()) makeDraggable(w, w.querySelector('.titlebar'), {});
  }
  function focus(w) { w.style.zIndex = ++z; }

  // Anything with data-open (menu bar, dock, finder items) opens a window
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-open]');
    if (t) openWin(t.dataset.open);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const top = [...winLayer.children].sort((a, b) => b.style.zIndex - a.style.zIndex)[0];
      if (top) top.querySelector('.close').click();
    }
  });

  /* ---------- Dragging (mouse + touch) ---------- */
  function makeDraggable(el, handle, { onClick, keepInside }) {
    let sx, sy, ox, oy, moved = false, dragging = false;
    handle.addEventListener('pointerdown', e => {
      if (e.target.closest('.close, .zoom') || el.classList.contains('max')) return;
      if (isMobile()) return; // on phones things sit in a grid: tap to open
      dragging = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      ox = el.offsetLeft; oy = el.offsetTop;
      handle.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
    });
    handle.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      const maxX = desktop.clientWidth - 40, maxY = desktop.clientHeight - 40;
      el.style.left = Math.min(maxX, Math.max(-el.offsetWidth + 80, ox + dx)) + 'px';
      el.style.top = Math.min(maxY, Math.max(0, oy + dy)) + 'px';
    });
    const end = () => {
      if (!dragging) return;
      dragging = false; el.classList.remove('dragging');
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
    if (onClick) handle.addEventListener('click', () => { if (!moved) onClick(); moved = false; });
  }

  /* ---------- "portfolio." letters grow near the mouse ---------- */
  (() => {
    const h1 = document.querySelector('.welcome h1');
    const word = h1.textContent;
    h1.setAttribute('aria-label', word);
    h1.innerHTML = [...word].map(ch => `<span class="ltr" aria-hidden="true">${ch}</span>`).join('');
    const letters = [...h1.querySelectorAll('.ltr')];
    const reach = 160;   // how far (px) from the mouse letters start to grow
    const grow = 0.45;   // how much the closest letter grows (0.45 = 45% bigger)
    h1.addEventListener('pointermove', e => {
      letters.forEach(l => {
        const r = l.getBoundingClientRect();
        const d = Math.abs(e.clientX - (r.left + r.width / 2));
        const t = Math.max(0, 1 - d / reach);
        const ease = t * t * (3 - 2 * t);
        l.style.transform = `translateY(${-ease * 6}px) scale(${1 + ease * grow})`;
        l.style.marginInline = `${ease * 0.11}em`;   // push neighbours apart so letters don't overlap
        l.style.color = ease > .55 ? 'var(--pink-deep)' : '';
      });
    });
    h1.addEventListener('pointerleave', () => letters.forEach(l => { l.style.transform = ''; l.style.color = ''; l.style.marginInline = ''; }));
  })();

  /* ---------- Pink sparkle trail that follows the mouse ---------- */
  (() => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = document.createElement('div');
    layer.className = 'sparkle-layer';
    document.body.appendChild(layer);
    const colors = ['#f48fb1', '#f8bbd0', '#ec6fa0', '#ffd1e3', '#e75b93'];
    const shapes = ['✦', '✧', '⋆', '•'];
    let last = 0;
    document.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse') return;          // no trail on touch screens
      const now = performance.now();
      if (now - last < 28) return;                    // limit how many we make
      last = now;
      if (layer.childElementCount > 60) return;
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      const size = 8 + Math.random() * 12;
      s.style.cssText = `left:${e.clientX}px; top:${e.clientY}px; font-size:${size}px; color:${colors[Math.floor(Math.random() * colors.length)]};
        --dx:${(Math.random() - .5) * 40}px; --dy:${12 + Math.random() * 30}px; --r:${(Math.random() - .5) * 180}deg;`;
      layer.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    });
  })();

  /* ---------- Clock + sticky note ---------- */
  const clock = document.getElementById('clock');
  const tick = () => clock.textContent = new Date().toLocaleString([], isMobile()
    ? { hour: 'numeric', minute: '2-digit' }
    : { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  tick(); setInterval(tick, 15000);
  makeDraggable(document.getElementById('sticky'), document.getElementById('sticky'), {});
  </script>
</body>
</html>
